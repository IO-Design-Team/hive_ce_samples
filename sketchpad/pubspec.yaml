name: sketchpad
description: A HiveDB sample project.

publish_to: "none"

version: 1.0.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.4.0

dev_dependencies:
  build_runner: ^2.16.1
  hive_ce_generator: ^1.11.3

flutter:
  uses-material-design: true

  fonts:
    - family: OpenSans
      fonts:
        - asset: fonts/OpenSans-Regular.ttf
